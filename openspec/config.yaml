schema: spec-driven

context: |
  Abi is a TypeScript Node.js execution service between Strategy Runtime and
  Bybit. HTTP routes stay thin; use-case logic lives in src/services
  (entry-package, openPosition). Domain types live in src/domain, position
  sizing in src/risk, guarded Bybit execution in src/execution, exchange
  mapping in src/exchange, and the durable entry-package correlation store
  in src/correlation.
  Runtime owns strategy decisions, trade-cycle lifecycle, and the supplied
  risk multiplier. Abi owns exchange execution, deterministic order
  identity, position sizing from Bybit trading rules, confirmation, and its
  own correlation record of what it has done.
  Mainnet live execution is always blocked by the live guard; only demo or
  testnet can execute live, and only when explicitly enabled.
  Preserve dry-run behavior and demo/testnet safety gates.
  Validate changes with npm test and npm run typecheck when runtime code changes.

rules:
  proposal:
    - State the user-visible or operational outcome and explicit non-goals.
    - Call out trading-safety, idempotency, recovery, and correlation-store implications.
    - Identify whether behavior affects dry-run, demo/testnet live execution, or mainnet guards.
  tasks:
    - Include focused tests for changed behavior and run npm test.
    - Keep runtime changes within the existing architecture and avoid unrelated refactors.
    - For live smoke work, include guard verification and cleanup checks.
