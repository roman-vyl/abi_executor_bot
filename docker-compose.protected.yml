name: abi-protected
services:
  abi:
    build:
      context: .
    image: abi:protected-local
    restart: "no"
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    memswap_limit: 256m
    ulimits:
      core: 0
    ports:
      - "127.0.0.1:8788:8787"
    environment:
      ABI_PROTECTED_CREDENTIALS_DIR: "/run/abi-credentials"
      ABI_ENTRY_PACKAGE_CORRELATION_PATH: "/app/var/abi_entry_package_correlation.jsonl"
      ABI_DRY_RUN: "false"
      ABI_LIVE_TRADING_ENABLED: "true"
      BYBIT_ENV: "demo"
      ABI_BYBIT_LINEAR_POSITION_BINDING_MODE: "${ABI_BYBIT_LINEAR_POSITION_BINDING_MODE:-one_way}"
    tmpfs:
      - /run/abi-credentials:rw,noexec,nosuid,nodev,size=65536,uid=1000,gid=1000,mode=0700
    volumes:
      - type: bind
        source: ${BBB_DATA_ROOT:?BBB_DATA_ROOT must be set}/abi-protected-demo
        target: /app/var
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 20s
