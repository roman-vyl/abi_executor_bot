name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Validate OpenAPI
        run: npm run validate:openapi

      - name: OpenSpec strict validation
        run: npx -y -p @fission-ai/openspec openspec validate --all --strict --no-interactive
